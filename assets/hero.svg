<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0%" stop-color="#ff7a7a">
        <animate attributeName="stop-color" values="#ff7a7a;#ffd27a;#89ff7a;#a78bff;#ff7a7a" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#8ab3ff">
        <animate attributeName="stop-color" values="#8ab3ff;#ffa1ff;#ffd27a;#89ff7a;#8ab3ff" dur="12s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <filter id="f" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="card">
      <rect x="40" y="40" rx="20" ry="20" width="920" height="220"/>
    </clipPath>
  </defs>

  <rect width="100%" height="100%" fill="black" opacity="0.85"/>
  <g clip-path="url(#card)">
    <!-- animated gradient background -->
    <rect x="40" y="40" width="920" height="220" fill="url(#g)" />

    <!-- orbiting particles -->
    <g opacity="0.95" filter="url(#f)">
      <circle cx="200" cy="120" r="26" fill="#ffffff" opacity="0.08">
        <animate attributeName="cx" values="160;240;160" dur="9s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="100;140;100" dur="7s" repeatCount="indefinite"/>
      </circle>
      <circle cx="460" cy="80" r="18" fill="#ffffff" opacity="0.10">
        <animate attributeName="cx" values="420;500;420" dur="8s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="60;100;60" dur="6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="720" cy="160" r="34" fill="#ffffff" opacity="0.06">
        <animate attributeName="cx" values="680;760;680" dur="10s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="140;180;140" dur="9s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- morphing shape / badge -->
    <path id="m" d="M140,200 Q260,50 380,200 T620,200 Q740,50 860,200 L860,240 L140,240 Z"
      fill="rgba(0,0,0,0.14)" stroke="rgba(255,255,255,0.06)" stroke-width="1">
      <animate attributeName="d"
        dur="10s"
        repeatCount="indefinite"
        values="
          M140,200 Q260,50 380,200 T620,200 Q740,50 860,200 L860,240 L140,240 Z;
          M140,180 Q260,80 380,220 T620,180 Q740,80 860,220 L860,240 L140,240 Z;
          M140,200 Q260,30 380,200 T620,200 Q740,30 860,200 L860,240 L140,240 Z;
          M140,200 Q260,50 380,200 T620,200 Q740,50 860,200 L860,240 L140,240 Z"/>
    </path>

    <!-- headline & typed effect (opacity cycling) -->
    <g font-family="Segoe UI, Roboto, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial" fill="white">
      <text x="80" y="120" font-size="28" font-weight="700" fill-opacity="0.98">Hi, I'm Saiprasad — I design, code, and automate</text>

      <g transform="translate(80,160)" font-size="18" fill-opacity="0.92">
        <text id="t1" x="0" y="0">Full‑stack Engineer • DevOps • Open‑Source</text>
        <text id="t2" x="0" y="0" opacity="0">Realtime Architect • ML Explorer • UI/UX</text>

        <animate xlink:href="#t1" attributeName="opacity" values="1;0;0;1" dur="8s" repeatCount="indefinite"/>
        <animate xlink:href="#t2" attributeName="opacity" values="0;1;1;0" dur="8s" repeatCount="indefinite"/>
      </g>
    </g>

    <!-- floating 3D-like cube (simple) -->
    <g transform="translate(810,70) scale(0.9)">
      <polygon points="0,20 20,0 40,20 20,40" fill="rgba(255,255,255,0.08)"/>
      <polygon points="0,20 20,0 20,40 0,60" fill="rgba(255,255,255,0.06)">
        <animateTransform attributeName="transform" attributeType="XML" type="rotate" from="0 20 30" to="360 20 30" dur="14s" repeatCount="indefinite"/>
      </polygon>
    </g>
  </g>

  <!-- subtle frame -->
  <rect x="40" y="40" width="920" height="220" rx="20" ry="20" fill="none" stroke="rgba(255,255,255,0.03)" />
</svg>
